##############################################
# EXTENT REPORT CONFIGURATION (UI TESTS)
##############################################

# Enable Spark/HTML reporter
extent.reporter.spark.start=true

# Output location for UI ExtentReport
extent.reporter.spark.out=reports/ui/ExtentReport_UI.html

# View order in the Spark report
extent.reporter.spark.vieworder=dashboard,test,exception,author,device,log

##############################################
# SCREENSHOT CONFIGURATION
##############################################

# Where screenshots will be stored (timestamped)
screenshot.dir=src/test/screenShots/${timestamp}/

# Relative path used inside the report
screenshot.rel.path=../

##############################################
# SYSTEM INFO (Shown in Report)
##############################################

systeminfo.user=Aktaruzzaman
systeminfo.build=1.2
systeminfo.AppName=Para Bank



